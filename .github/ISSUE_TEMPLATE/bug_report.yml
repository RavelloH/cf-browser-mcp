name: Bug report
description: Report a reproducible problem with cf-browser-mcp.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认没有发布 OAuth token、Cookie、授权密钥、站点数据或其他个人信息。
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or commit SHA.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: MCP tool
      description: Which MCP tool or setup step is affected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible sequence, with secrets and personal data removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, cookies, authorization headers, private URLs, and personal data.
    validations:
      required: false
